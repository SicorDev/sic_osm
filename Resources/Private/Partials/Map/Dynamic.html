<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:comment>
    Leaflet is delivered from this extension (no CDN). Required regardless of includeDefaultCss.
    The map tiles themselves are loaded by the visitor's browser from the tile server of the chosen layer.
</f:comment>
<f:asset.css identifier="leaflet" href="EXT:sic_osm/Resources/Public/Contrib/leaflet/leaflet.css" />
<f:asset.script identifier="leaflet" src="EXT:sic_osm/Resources/Public/Contrib/leaflet/leaflet.js" defer="1" />
<f:asset.script identifier="sic-osm" src="EXT:sic_osm/Resources/Public/JavaScript/sic_osm.js" defer="1" />

<figure class="sic-osm sic-osm--dynamic{f:if(condition: layout.focusLow, then: ' sic-osm--focus-low')}{f:if(condition: map.grayscale, then: ' sic-osm--grayscale')}"
        style="--sic-osm-height: {layout.height}px"
        data-sic-osm-uid="{data.uid}">
    <f:comment>As wide as the container, height from --sic-osm-height (CSS, at most 70% of the viewport)</f:comment>
    <div class="sic-osm__map"
         role="region"
         aria-label="{f:translate(key: 'map.alt', arguments: {0: map.title})}"
         data-sic-osm-config="{dynamicConfig}"></div>
    <f:if condition="{marker}">
        <f:comment>Same marker markup as the static view; sic_osm.js uses it as Leaflet divIcon</f:comment>
        <template class="sic-osm__marker-template">
            <f:render partial="Map/Marker" arguments="{map: map, marker: marker, layout: layout}" />
        </template>
        <f:if condition="{map.popup}">
            <f:render partial="Map/Popup" arguments="{map: map, layout: layout, below: 1}" />
        </f:if>
    </f:if>
    <noscript>
        <p class="sic-osm__noscript">
            <f:translate key="map.noscript" />
            <a href="https://www.openstreetmap.org/?mlat={map.latitude}&amp;mlon={map.longitude}#map={map.zoom}/{map.latitude}/{map.longitude}" target="_blank" rel="noopener noreferrer"><f:translate key="map.openOsm" /></a>
        </p>
    </noscript>
</figure>

</html>
